name: "ER-Adlernest"
version: "1.2.5"
slug: "er_adlernest"
description: "Your Eagle Eye for Home Assistant Surveillance - Modern CCTV live viewer, archive manager and NAS recording explorer."
url: "https://github.com/Eidolf/hassio-addons/tree/main/er_adlernest"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
panel_icon: "mdi:cctv"
panel_title: "ER-Adlernest"
panel_admin: false
ingress: true
ingress_port: 8098
ingress_entry: "/"
homeassistant_api: true
hassio_api: true
hassio_role: manager
host_network: false
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
map:
  - "share:rw"
  - "media:rw"
  - "config:rw"
options:
  log_level: "info"
schema:
  log_level: list(debug|info|warning|error)
