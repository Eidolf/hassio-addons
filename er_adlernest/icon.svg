<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <polygon points="256,32 448,112 400,384 256,480 112,384 64,112" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="12" stroke-linejoin="round"/>
  <!-- Geometric Eagle Head -->
  <polygon points="256,96 360,192 336,320 256,384 176,320 152,192" fill="#1e293b" stroke="#2563eb" stroke-width="8"/>
  <polygon points="256,128 320,208 256,352 192,208" fill="url(#blueGrad)" opacity="0.85"/>
  <!-- Eagle Beak -->
  <polygon points="256,256 296,288 256,370 216,288" fill="#06b6d4"/>
  <!-- Camera Lens Eye -->
  <circle cx="216" cy="200" r="28" fill="#0f172a" stroke="#06b6d4" stroke-width="6"/>
  <circle cx="216" cy="200" r="14" fill="#06b6d4"/>
  <circle cx="222" cy="194" r="4" fill="#ffffff"/>
  <!-- Right Eye Slit -->
  <polygon points="290,194 324,204 300,212" fill="#06b6d4"/>
</svg>
